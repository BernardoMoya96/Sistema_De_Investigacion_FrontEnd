<div class="modal-header">
    <h4 class="modal-title">{{title}}</h4>
    <button type="button" class="close" aria-label="Close" (click)="dismiss()" >
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body" [innerHTML]="message"></div>
<div class="modal-footer">
    <button *ngIf="btnCancelText&&btnCancelText.length > 0" type="button" ngbAutofocus class="btn btn-danger" (click)="decline()"> {{btnCancelText}}</button>
    <button *ngIf="btnOKText&&btnOKText.length > 0" type="button" ngbAutofocus class="btn btn-primary" (click)="accept()"> {{btnOKText}}</button>
</div>
