<div class="modal-header">
    <h4 class="modal-title">Selecciona uno de los siguientes roles para continuar</h4>
</div>
<div class="modal-body">
    <label for="rol">Rol:</label>
    <select id="rol" name="rol" class="form-control" [(ngModel)]="selectedRole">
        <option *ngFor="let opt of options" value="{{opt.key}}">{{opt.value}}</option>
    </select>
</div>
<div class="modal-footer">
    <button  ngbAutofocus class="btn btn-primary" (click)="continue()">Continuar</button>
</div>
